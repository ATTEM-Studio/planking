name: Place Fields Diagnostic Temp

on:
  push:
    branches:
      - feat/ui-place-metrics

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: collector
        run: npm install
      - working-directory: collector
        run: npx playwright install --with-deps chromium
      - name: Inspect paginated GraphQL metric fields
        run: node collector/src/diagnose-place-fields.mjs '하단맛집'
