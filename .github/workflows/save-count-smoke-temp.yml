name: Save Count Smoke Temp

on:
  push:
    branches:
      - feat/save-count-enrichment

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install collector dependencies
        working-directory: collector
        run: npm install
      - name: Install Chromium
        working-directory: collector
        run: npx playwright install --with-deps chromium
      - name: Diagnose getRestaurants GraphQL
        working-directory: collector
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const keyword = '하단고기집';
          const targetMid = '1800550902';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1920, height: 1080 },
            locale: 'ko-KR',
            timezoneId: 'Asia/Seoul',
            geolocation: { latitude: 35.153272, longitude: 129.034248 },
            permissions: ['geolocation'],
          });
          const page = await context.newPage();

          page.on('request', request => {
            const url = request.url();
            if (!url.includes('graphql')) return;
            try {
              const parsed = JSON.parse(request.postData() || 'null');
              const ops = Array.isArray(parsed) ? parsed : [parsed];
              for (const op of ops) {
                console.log('GRAPHQL_REQUEST', JSON.stringify({
                  url,
                  operationName: op?.operationName ?? null,
                  input: op?.variables?.input ?? null,
                }));
              }
            } catch {}
          });

          page.on('response', async response => {
            const url = response.url();
            if (!url.includes('graphql')) return;
            try {
              const payload = await response.json();
              const roots = Array.isArray(payload) ? payload : [payload];
              for (const root of roots) {
                const items = root?.data?.restaurants?.businesses?.items;
                if (!Array.isArray(items)) continue;
                console.log('BUSINESS_ITEMS', JSON.stringify(items.slice(0, 5).map(item => ({
                  id: item?.id ?? null,
                  name: item?.name ?? null,
                  saveCount: item?.saveCount ?? null,
                  visitorReviewCount: item?.visitorReviewCount ?? null,
                  blogCafeReviewCount: item?.blogCafeReviewCount ?? null,
                  keys: Object.keys(item ?? {}).sort(),
                }))));
                const target = items.find(item => String(item?.id ?? '') === targetMid);
                console.log('TARGET_ITEM', JSON.stringify(target ? {
                  id: target.id,
                  name: target.name,
                  saveCount: target.saveCount ?? null,
                  visitorReviewCount: target.visitorReviewCount ?? null,
                  blogCafeReviewCount: target.blogCafeReviewCount ?? null,
                  keys: Object.keys(target).sort(),
                } : null));
              }
            } catch (error) {
              console.log('GRAPHQL_RESPONSE_PARSE_ERROR', String(error?.message ?? error));
            }
          });

          await page.goto(`https://search.naver.com/search.naver?where=nexearch&query=${encodeURIComponent(keyword)}`, {
            waitUntil: 'domcontentloaded',
            timeout: 15000,
          });
          await page.waitForTimeout(8000);
          await context.close();
          await browser.close();
          NODE
