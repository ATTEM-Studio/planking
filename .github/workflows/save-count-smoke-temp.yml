name: Save Count Smoke Temp

on:
  push:
    branches:
      - feat/save-count-enrichment

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install collector dependencies
        working-directory: collector
        run: npm install
      - name: Install Chromium
        working-directory: collector
        run: npx playwright install --with-deps chromium
      - name: Live collector saveCount smoke
        run: |
          OUTPUT=$(node collector/src/cli.mjs once --keyword "하단고기집" --mid "1800550902")
          echo "$OUTPUT"
          node -e 'const r=JSON.parse(process.argv[1]); if(r.status!=="FOUND") process.exit(2); if(r.placeMetrics?.saveCountRaw!=="87,000+") { console.error("unexpected saveCountRaw", r.placeMetrics?.saveCountRaw); process.exit(3); } console.log("verified saveCountRaw="+r.placeMetrics.saveCountRaw);' "$OUTPUT"
