name: Save Count Smoke Temp

on:
  push:
    branches:
      - feat/save-count-enrichment

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install collector dependencies
        working-directory: collector
        run: npm install
      - name: Install Chromium
        working-directory: collector
        run: npx playwright install --with-deps chromium
      - name: Live Naver saveCount smoke
        run: |
          OUTPUT=$(node collector/src/cli.mjs once --keyword "하단카페" --mid "1328453904")
          echo "$OUTPUT"
          node -e 'const r=JSON.parse(process.argv[1]); if(r.status!=="FOUND") process.exit(2); if(!r.placeMetrics?.saveCountRaw) { console.error("saveCountRaw missing"); process.exit(3); } console.log("saveCountRaw="+r.placeMetrics.saveCountRaw);' "$OUTPUT"
