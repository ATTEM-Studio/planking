name: Save Count Smoke Temp

on:
  push:
    branches:
      - feat/save-count-enrichment

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install collector dependencies
        working-directory: collector
        run: npm install
      - name: Install Chromium
        working-directory: collector
        run: npx playwright install --with-deps chromium
      - name: Replay getRestaurants for exact place name
        working-directory: collector
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const seedKeyword = '하단고기집';
          const exactPlaceName = '부산삼겹살 하단본점 숯불갈비';
          const targetMid = '1800550902';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1920, height: 1080 }, locale: 'ko-KR' });
          const page = await context.newPage();
          let template = null;
          let endpoint = null;

          page.on('request', request => {
            if (template) return;
            const url = request.url();
            if (!url.includes('p-api.place.naver.com/graphql')) return;
            try {
              const body = JSON.parse(request.postData() || 'null');
              const ops = Array.isArray(body) ? body : [body];
              if (!ops.some(op => op?.operationName === 'getRestaurants')) return;
              template = body;
              endpoint = url;
              console.log('CAPTURED_TEMPLATE', JSON.stringify({ endpoint, isArray: Array.isArray(body) }));
            } catch {}
          });

          await page.goto(`https://search.naver.com/search.naver?where=nexearch&query=${encodeURIComponent(seedKeyword)}`, {
            waitUntil: 'domcontentloaded', timeout: 15000,
          });

          const started = Date.now();
          while (!template && Date.now() - started < 10000) await page.waitForTimeout(50);
          if (!template) throw new Error('getRestaurants template not captured');

          function rewrite(body, removeNlu) {
            const copy = JSON.parse(JSON.stringify(body));
            const ops = Array.isArray(copy) ? copy : [copy];
            for (const op of ops) {
              if (op?.operationName !== 'getRestaurants' || !op?.variables?.input) continue;
              op.variables.input.query = exactPlaceName;
              op.variables.input.start = 1;
              op.variables.input.display = 50;
              if (removeNlu) delete op.variables.input.nlu;
            }
            return copy;
          }

          async function replay(label, body) {
            const result = await page.evaluate(async ({ endpoint, body }) => {
              const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify(body),
              });
              return { status: response.status, json: await response.json() };
            }, { endpoint, body });
            const roots = Array.isArray(result.json) ? result.json : [result.json];
            const items = roots.flatMap(root => root?.data?.restaurants?.businesses?.items ?? []);
            const target = items.find(item => String(item?.id ?? '') === targetMid) ?? null;
            console.log(label, JSON.stringify({
              status: result.status,
              itemCount: items.length,
              target: target ? {
                id: target.id,
                name: target.name,
                saveCount: target.saveCount ?? null,
                visitorReviewCount: target.visitorReviewCount ?? null,
                blogCafeReviewCount: target.blogCafeReviewCount ?? null,
              } : null,
              firstItems: items.slice(0, 5).map(item => ({ id: item?.id, name: item?.name, saveCount: item?.saveCount ?? null })),
            }));
          }

          await replay('REPLAY_WITHOUT_NLU', rewrite(template, true));
          await replay('REPLAY_WITH_STALE_NLU', rewrite(template, false));
          await context.close();
          await browser.close();
          NODE
