name: Organic End Diagnostic

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix collector
      - run: npx --prefix collector playwright install --with-deps chromium
      - run: node collector/scripts/inspect-organic-end.mjs
        env:
          KEYWORD: 황성동맛집
