name: Organic Ranking Diagnostic

on:
  push:
    branches:
      - fix/organic-end-aware-ranking
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix collector >/dev/null 2>&1
      - run: npm test --prefix collector
      - run: npx --prefix collector playwright install --with-deps chromium >/dev/null 2>&1
      - run: node collector/scripts/inspect-ui-pagination.mjs
      - run: node collector/scripts/inspect-search-more.mjs
