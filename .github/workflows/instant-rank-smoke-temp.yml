name: Instant Rank Smoke Temp

on:
  push:
    branches:
      - feat/instant-first-rank-check

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install serverless dependencies
        run: npm install
      - name: Live instant Chromium collector smoke
        run: |
          node --input-type=module <<'NODE'
          import { NaverMapCollector } from './collector/src/naver-map-collector.mjs';
          import { serverlessBrowserFactory } from './api/rank_collect.mjs';

          const collector = new NaverMapCollector({
            browserFactory: serverlessBrowserFactory,
            timeoutMs: 15000,
            pageDelayMs: 450,
            metricEnrichmentTimeoutMs: 9000,
          });
          const result = await collector.collect({
            keyword: '하단고기집',
            targetMid: '1800550902',
            maxRank: 300,
          });
          console.log(JSON.stringify(result));
          if (result.status !== 'FOUND') process.exit(2);
          NODE
