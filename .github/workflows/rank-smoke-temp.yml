name: Rank Collector Smoke Temp

on:
  push:
    branches: [feat/rank-collector-v1]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector
        run: npm install --prefix collector
      - name: Install Chromium
        run: npx --prefix collector playwright install --with-deps chromium
      - name: Run live one-shot smoke
        shell: bash
        run: |
          set +e
          node collector/src/cli.mjs once --keyword "경성대맛집" --mid "1340244014" | tee /tmp/rank-smoke.json
          code=${PIPESTATUS[0]}
          set -e
          cat /tmp/rank-smoke.json
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "unexpected collector exit code: $code"
            exit "$code"
          fi
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync("/tmp/rank-smoke.json", "utf8").trim();
            const result = JSON.parse(text);
            const allowed = new Set(["FOUND", "OUT_OF_RANGE", "BLOCKED", "TIMEOUT", "FAILED"]);
            if (!allowed.has(result.status)) throw new Error(`unexpected status: ${result.status}`);
            if (["BLOCKED", "TIMEOUT", "FAILED"].includes(result.status) && result.rank !== null) {
              throw new Error(`${result.status} must keep rank null`);
            }
            if (result.status === "OUT_OF_RANGE" && result.rank !== null) {
              throw new Error("OUT_OF_RANGE must keep rank null");
            }
            if (result.status === "FOUND" && !(Number.isInteger(result.rank) && result.rank >= 1 && result.rank <= 300)) {
              throw new Error(`invalid FOUND rank: ${result.rank}`);
            }
            console.log(`smoke status=${result.status} rank=${result.rank}`);
          '
